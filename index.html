<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grade Predictor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Grade Predictor</h1>
        
        <div class="subject-selection">
            <label for="subject">Select Subject:</label>
            <select id="subject">
                <option value="">-- Choose a subject --</option>
                <option value="MLT">MLT</option>
                <option value="BDM">BDM</option>
                <option value="MAD2">MAD2</option>
            </select>
        </div>

        <div id="inputs-container" class="inputs-container" style="display: none;">
            <div class="input-group">
                <label id="label-gaa"></label>
                <input type="number" id="gaa" min="0" max="100" placeholder="0-100">
                <span class="error-message" id="error-gaa"></span>
            </div>

            <div class="input-group">
                <label for="qz1">Enter Qz1:</label>
                <input type="number" id="qz1" min="0" max="100" placeholder="0-100">
                <span class="error-message" id="error-qz1"></span>
            </div>

            <div class="input-group">
                <label for="qz2">Enter Qz2:</label>
                <input type="number" id="qz2" min="0" max="100" placeholder="0-100">
                <span class="error-message" id="error-qz2"></span>
            </div>

            <div id="bonus-container" class="input-group" style="display: none;">
                <label for="bonus">Enter Bonus:</label>
                <input type="number" id="bonus" min="0" max="100" placeholder="0-100">
                <span class="error-message" id="error-bonus"></span>
            </div>

            <button id="calculate-btn" class="btn">Calculate</button>
        </div>

        <div id="results-container" class="results-container" style="display: none;">
            <h2>Results</h2>
            <table class="predictions-table">
                <thead>
                    <tr>
                        <th>Grade</th>
                        <th>Minimum F</th>
                        <th>T</th>
                    </tr>
                </thead>
                <tbody id="results-table">
                </tbody>
            </table>
            <button id="reset-btn" class="btn btn-secondary">Clear & Start Over</button>
        </div>

        <div id="history-container" class="history-container">
            <div class="history-header">
                <h2>History</h2>
                <button id="clear-history-btn" class="btn btn-small btn-danger">Clear All</button>
            </div>
            <div id="history-list" class="history-list">
                <p class="empty-message">No predictions yet. Start by selecting a subject!</p>
            </div>
        </div>

        <div id="error-container" class="error-container" style="display: none;">
            <p id="error-message"></p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
